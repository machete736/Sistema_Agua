{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión | Junta Vecinal Paraíso — Sistema de Agua</title>

  <link rel="stylesheet" href="{% static 'adminlte/plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'adminlte/css/adminlte.min.css' %}">

  <style>
    /* =========================================
       1. FUENTES LOCALES
       ========================================= */
    @font-face {
      font-family: 'Baloo 2';
      src: url("{% static 'fonts/Baloo2-Bold.ttf' %}") format('truetype');
      font-weight: 700;
    }

    @font-face {
      font-family: 'Manrope';
      src: url("{% static 'fonts/Manrope-SemiBold.ttf' %}") format('truetype');
      font-weight: 600;
    }

    :root {
      --azul:        #1da1f2;
      --azul-deep:   #0d52a1;
      --lima:        #c6f24a;
      --naranja:     #ff8a3d;
      --tinta:       #0c2340;
      --crema:       #b7dea6;
    }

    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width: 100%; height: 100%; }

    body {
      font-family: 'Manrope', sans-serif;
      background-color: var(--crema);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* =========================================
       2. FONDO DE ONDA AZUL FUERTE
       ========================================= */
    .olas-fondo {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .olas-fondo svg { width: 100%; height: 100%; object-fit: cover; }

    /* =========================================
       3. GOTAS DE AGUA REALISTAS (3D CSS)
       ========================================= */
    .contenedor-gotas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
    }
    
    .gota-realista {
      position: absolute;
      border-radius: 43% 57% 41% 59% / 46% 51% 49% 54%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(2px);
      box-shadow: 
        inset 6px 6px 10px rgba(255, 255, 255, 0.8), 
        inset -4px -4px 10px rgba(13, 82, 161, 0.3), 
        5px 10px 15px rgba(0, 0, 0, 0.08);
      animation: caerFluido linear infinite;
    }

    @keyframes caerFluido {
      0% { transform: translateY(-50px) scale(0.9); opacity: 0; }
      15% { opacity: 1; border-radius: 40% 60% 50% 50% / 40% 50% 60% 50%; }
      50% { border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%; }
      85% { opacity: 1; }
      100% { transform: translateY(110vh) scale(1.1); opacity: 0; border-radius: 43% 57% 41% 59% / 46% 51% 49% 54%; }
    }

    /* =========================================
       4. TARJETA EFECTO CRISTAL (GLASSMORPHISM)
       ========================================= */
    .panel-acceso {
      position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 20px;
    }

    .acceso-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      padding: 40px 35px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
    }

    .login-header-marca { text-align: center; margin-bottom: 25px; }
    
    .gota-logo {
      width: 45px; height: 45px; margin: 0 auto 10px;
      background: linear-gradient(135deg, #ffffff, var(--azul));
      border-radius: 50% 50% 50% 5px;
      transform: rotate(45deg);
      box-shadow: 4px 4px 10px rgba(29, 161, 242, 0.4);
    }

    .acceso-eyebrow {
      display: inline-block; font-size: 0.7rem; font-weight: 800;
      text-transform: uppercase; color: var(--azul-deep); margin-bottom: 5px;
    }
    
    .acceso-card h2 {
      font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 2rem;
      color: var(--tinta); margin: 0 0 5px; line-height: 1.1;
    }
    .acceso-card h3 {
      font-size: 1.2rem; font-weight: 600; color: var(--tinta); margin: 0 0 20px;
    }

    .campo { margin-bottom: 18px; }
    .campo-input {
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px; padding: 0 6px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
    }
    .campo-input i { color: #8e9aa8; padding: 0 14px; font-size: 1rem; }
    .campo-input input {
      flex: 1; border: none; outline: none; background: transparent;
      padding: 14px 12px 14px 0; font-size: 0.95rem; font-weight: 600;
    }

    /* Botón para ver contraseña */
    .btn-ver-password {
      background: none;
      border: none;
      padding: 0 14px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-ver-password i {
      padding: 0;
      transition: color 0.2s ease;
    }
    .btn-ver-password:hover i {
      color: var(--azul-deep);
    }

    .btn-ingresar {
      width:100%; padding: 16px; margin-top: 10px;
      background: var(--naranja); border:none; border-radius: 16px;
      color:#fff; font-family:'Baloo 2', sans-serif; font-size: 1.1rem; font-weight: 700;
      cursor:pointer; box-shadow: 0 6px 15px rgba(255,138,61,0.4);
    }

    .etiqueta-socios {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--naranja); color: #fff; font-weight: 800; font-size: 0.78rem;
      padding: 6px 14px; border-radius: 100px; margin-top: 20px;
    }
    
    .adorno-hoja {
      position: absolute; top: -15px; right: 15px; width: 40px; height: 40px;
      background: var(--lima); border-radius: 40px 0 40px 40px;
      box-shadow: 5px 5px 15px rgba(198,242,74,0.5); z-index: 11;
    }
  
    /* =========================================
       5. ADAPTABILIDAD PARA CELULARES
       ========================================= */
    @media (max-width: 480px) {
      .panel-acceso { padding: 15px; }
      .acceso-card { padding: 30px 25px; border-radius: 24px; }
      .acceso-card h2 { font-size: 1.7rem; }
      
      .gota-realista:nth-child(1),
      .gota-realista:nth-child(3),
      .gota-realista:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

  <div class="olas-fondo">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,200 C300,100 600,450 1440,250 L1440,750 C1000,900 400,600 0,850 Z" fill="#2d82d4"/>
      <path d="M0,250 C400,150 700,500 1440,300 L1440,700 C900,850 500,650 0,800 Z" fill="#1da1f2" opacity="0.8"/>
    </svg>
  </div>

  <div class="contenedor-gotas">
    <div class="gota-realista" style="left: 10%; width: 40px; height: 45px; animation-duration: 4s; animation-delay: 0s;"></div>
    <div class="gota-realista" style="left: 25%; width: 25px; height: 28px; animation-duration: 5s; animation-delay: 2s;"></div>
    <div class="gota-realista" style="left: 45%; width: 50px; height: 55px; animation-duration: 6s; animation-delay: 1s;"></div>
    <div class="gota-realista" style="left: 70%; width: 30px; height: 35px; animation-duration: 4.5s; animation-delay: 3s;"></div>
    <div class="gota-realista" style="left: 85%; width: 45px; height: 50px; animation-duration: 5.5s; animation-delay: 0.5s;"></div>
    <div class="gota-realista" style="left: 15%; width: 15px; height: 18px; animation-duration: 3s; animation-delay: 1.5s;"></div>
    <div class="gota-realista" style="left: 60%; width: 18px; height: 20px; animation-duration: 3.5s; animation-delay: 0.8s;"></div>
    <div class="gota-realista" style="left: 92%; width: 12px; height: 14px; animation-duration: 4.2s; animation-delay: 2.5s;"></div>
  </div>

  <div class="panel-acceso">
    <div class="adorno-hoja"></div>

    <div class="acceso-card">
      <div class="login-header-marca">
        <div class="gota-logo"></div>
        <span class="acceso-eyebrow">Comité de Agua Potable</span>
        <h2>Junta Vecinal<br><span style="color: var(--azul);">Paraíso</span></h2>
      </div>

      <h3 style="text-align: center;">Sistema de Agua<br></h3>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="campo">
          <div class="campo-input">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Usuario" required>
          </div>
        </div>

        <div class="campo">
          <div class="campo-input">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            <button type="button" class="btn-ver-password" onclick="togglePassword()" aria-label="Mostrar u ocultar contraseña">
              <i class="fas fa-eye" id="icono-ojo"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-ingresar">Ingresar al sistema</button>
      </form>

      <center>
        <span class="etiqueta-socios"><i class="fas fa-tint"></i>2026</span>
      </center>
    </div>
  </div>

  <script>
    function togglePassword() {
      const inputPassword = document.getElementById('password');
      const iconoOjo = document.getElementById('icono-ojo');

      if (inputPassword.type === 'password') {
        inputPassword.type = 'text';
        iconoOjo.classList.remove('fa-eye');
        iconoOjo.classList.add('fa-eye-slash');
      } else {
        inputPassword.type = 'password';
        iconoOjo.classList.remove('fa-eye-slash');
        iconoOjo.classList.add('fa-eye');
      }
    }
  </script>

</body>
</html>
